# ---------------------------------------------------------------
# UI  (amber on charcoal)
# ---------------------------------------------------------------
lvgl:
  displays: [my_display]
  touchscreens: [my_touch]
  # Landscape. If the UI is upside-down (USB on the right), change 90 to 270.
  rotation: 90
  buffer_size: 25%
  bg_color: 0x090B0F
  text_font: montserrat_14
  text_color: 0xE8EAED

  on_idle:
    timeout: 30s
    then:
      - light.turn_off:
          id: back_light
          transition_length: 1s
      - lvgl.pause:

  style_definitions:
    - id: card
      bg_color: 0x262D39
      border_width: 0
      radius: 14
      pad_all: 0

  theme:
    button:
      bg_color: 0x262D39
      radius: 14
      border_width: 0
      shadow_width: 0
      pad_all: 0
      text_color: 0xE8EAED
      checked:
        bg_color: 0xFFB300
        text_color: 0x000000

  # Pill-shaped page switcher, always visible
  top_layer:
    widgets:
      - obj:
          align: bottom_left
          x: 8
          y: -6
          width: 304
          height: 38
          radius: 19
          bg_color: 0x262D39
          border_width: 0
          pad_all: 0
          scrollable: false
          widgets:
            - button:
                id: nav_lights
                x: 3
                y: 3
                width: 148
                height: 32
                radius: 16
                checkable: true
                state:
                  checked: true
                on_click:
                  - lvgl.page.show: lights_page
                widgets:
                  - label:
                      align: center
                      x: -34
                      text: "\U000F0335"
                      text_font: mdi_18
                  - label:
                      align: center
                      x: 10
                      text: "Lights"
            - button:
                id: nav_climate
                x: 153
                y: 3
                width: 148
                height: 32
                radius: 16
                checkable: true
                on_click:
                  - lvgl.page.show: climate_page
                widgets:
                  - label:
                      align: center
                      x: -40
                      text: "\U000F050F"
                      text_font: mdi_18
                  - label:
                      align: center
                      x: 10
                      text: "Climate"

  pages:
    # ------------------------- LIGHTS -------------------------
    - id: lights_page
      skip: false
      on_load:
        - lvgl.widget.update: {id: nav_lights, state: {checked: true}}
        - lvgl.widget.update: {id: nav_climate, state: {checked: false}}
      widgets:
        # ---- Bedroom: big tile with dimmer inside ----
        - button:
            id: bed_btn
            x: 8
            y: 6
            width: 304
            height: 88
            checkable: true
            scrollable: false
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.sovrum_ovre_lampor
            widgets:
              - label:
                  align: top_left
                  x: 14
                  y: 10
                  text: "\U000F0335"
                  text_font: mdi_24
              - label:
                  align: top_left
                  x: 48
                  y: 13
                  text: "Bedroom"
                  text_font: montserrat_16
              - label:
                  id: bed_sub
                  align: top_right
                  x: -14
                  y: 13
                  text: "Off"
                  text_font: montserrat_16
              - slider:
                  id: bed_slider
                  hidden: true
                  align: top_left
                  x: 16
                  y: 58
                  width: 272
                  height: 14
                  min_value: 1
                  max_value: 100
                  value: 1
                  bg_color: 0xCC8F00
                  indicator:
                    bg_color: 0x1A1200
                  knob:
                    bg_color: 0xFFFFFF
                    pad_all: 7
                  on_release:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: light.sovrum_ovre_lampor
                          brightness_pct: !lambda 'return to_string((int) lv_slider_get_value(id(bed_slider)));'
        # ---- Driveway tile ----
        - button:
            id: drive_btn
            x: 8
            y: 100
            width: 148
            height: 88
            checkable: true
            scrollable: false
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.ikea_of_sweden_tradfribulbe27wsglobeopal1055lm_light
            widgets:
              - label:
                  align: top_left
                  x: 14
                  y: 10
                  text: "\U000F010B"
                  text_font: mdi_24
              - label:
                  align: top_left
                  x: 14
                  y: 44
                  text: "Driveway"
                  text_font: montserrat_16
              - label:
                  id: drive_sub
                  align: top_left
                  x: 14
                  y: 68
                  text: "Off"
                  text_font: montserrat_12
                  text_opa: 70%
        # ---- Backyard tile ----
        - button:
            id: yard_btn
            x: 164
            y: 100
            width: 148
            height: 88
            checkable: true
            scrollable: false
            on_click:
              - homeassistant.action:
                  action: switch.toggle
                  data:
                    entity_id: switch.zigbeeplug1_0a6335fb_on_off
            widgets:
              - label:
                  align: top_left
                  x: 14
                  y: 10
                  text: "\U000F06A5"
                  text_font: mdi_24
              - label:
                  align: top_left
                  x: 14
                  y: 44
                  text: "Backyard"
                  text_font: montserrat_16
              - label:
                  id: yard_sub
                  align: top_left
                  x: 14
                  y: 68
                  text: "Off"
                  text_font: montserrat_12
                  text_opa: 70%

    # ------------------------- CLIMATE (gauge rings) -------------------------
    - id: climate_page
      on_load:
        - lvgl.widget.update: {id: nav_lights, state: {checked: false}}
        - lvgl.widget.update: {id: nav_climate, state: {checked: true}}
      widgets:
        - obj:
            styles: card
            x: 8
            y: 6
            width: 148
