esphome:
  name: cyd-remote
  friendly_name: CYD Remote

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key
  # Needed so the screen can call light.toggle etc. ALSO enable
  # "Allow the device to perform Home Assistant actions" in
  # Settings > Devices > CYD Remote > Configure after adopting it.

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Light sleep (the default) can make the board ignore incoming connections from HA.
  power_save_mode: none
  domain: .local

# ---------------------------------------------------------------
# Hardware (ESP32-2432S028R)
# ---------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    id: back_light
    internal: true
    restore_mode: ALWAYS_ON

display:
  # This is the model that gave a clean, correct picture on your board (confirmed by
  # photos). Your other projects drive it as an ILI9341 too. Models tried and rejected:
  #   esp32-2432S028-7789 -> blank white screen
  #   esp32-2432S028-9342 -> garbled, mirrored picture
  - platform: mipi_spi
    id: my_display
    model: esp32-2432S028
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 300
      x_max: 3850
      y_min: 170
      y_max: 3800
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - light.turn_on: back_light
            - lvgl.resume:
            - lvgl.widget.redraw:

# ---------------------------------------------------------------
# Icons (Material Design Icons, downloaded when you build)
# ---------------------------------------------------------------
font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_24
    size: 24
    bpp: 4
    glyphs: &mdi_glyphs
      - "\U000F0335"   # lightbulb
      - "\U000F010B"   # car
      - "\U000F06A5"   # power-plug
      - "\U000F050F"   # thermometer
      - "\U000F058C"   # water drop
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_18
    size: 18
    bpp: 4
    glyphs: *mdi_glyphs

# ---------------------------------------------------------------
# Home Assistant entities
# ---------------------------------------------------------------
binary_sensor:
  - platform: homeassistant
    id: bed_state
    entity_id: light.sovrum_ovre_lampor
    on_state:
      - lvgl.widget.update:
          id: bed_btn
          state:
            checked: !lambda return x;
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.show: bed_slider
          else:
            - lvgl.widget.hide: bed_slider
            - lvgl.label.update:
                id: bed_sub
                text: "Off"
  - platform: homeassistant
    id: drive_state
    entity_id: light.ikea_of_sweden_tradfribulbe27wsglobeopal1055lm_light
    on_state:
      - lvgl.widget.update:
          id: drive_btn
          state:
            checked: !lambda return x;
      - lvgl.label.update:
          id: drive_sub
          text: !lambda 'return std::string(x ? "On" : "Off");'
  - platform: homeassistant
    id: yard_state
    entity_id: switch.zigbeeplug1_0a6335fb_on_off
    on_state:
      - lvgl.widget.update:
          id: yard_btn
          state:
            checked: !lambda return x;
      - lvgl.label.update:
          id: yard_sub
          text: !lambda 'return std::string(x ? "On" : "Off");'

sensor:
  # ---- bedroom brightness (0-255 attribute -> slider 1-100) ----
  - platform: homeassistant
    id: bed_bright
    entity_id: light.sovrum_ovre_lampor
    attribute: brightness
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.slider.update:
                id: bed_slider
                value: !lambda 'return x / 2.55;'
            - lvgl.label.update:
                id: bed_sub
                text:
                  format: "%.0f%%"
                  args: ['x / 2.55']

  # ---- climate sensors ----
  - platform: homeassistant
    id: elise_t
    entity_id: sensor.lumi_lumi_weather_ad9e4708_temperature
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.label.update:
                id: elise_t_label
                text:
                  format: "%.1f°"
                  args: ['x']
            - lvgl.arc.update:
                id: elise_arc
                value: !lambda 'return (int) (x * 10);'
          else:
            - lvgl.label.update:
                id: elise_t_label
                text: "--"
  - platform: homeassistant
    id: elise_h
    entity_id: sensor.lumi_lumi_weather_ad9e4708_humidity
